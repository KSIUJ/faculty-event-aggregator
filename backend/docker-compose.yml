version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: local_postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: local_database
      
    ports:
      - "5432:5432"
      
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
