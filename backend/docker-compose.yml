version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: local_postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: ${DB_USER:-dev_user}
      POSTGRES_PASSWORD: ${DB_PASS:-dev_password}
      POSTGRES_DB: ${DB_NAME:-local_database}

    ports:
      - "${DB_PORT:-5432}:5432"
      
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
